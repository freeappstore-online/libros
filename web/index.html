<!doctype html>
<html lang="{{edition.language}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#fefdfb" id="theme-color" />
    <meta name="darkreader-lock" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.json" />
    <title>{{edition.title}}</title>
    <meta name="description" content="{{edition.description}}" />
    <meta property="og:title" content="{{edition.title}}" />
    <meta property="og:description" content="{{edition.shareDescription}}" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="{{locale.meta.ogLocale}}" />
    <meta property="og:url" content="{{edition.site}}/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="{{edition.title}}" />
    <meta name="twitter:description" content="{{edition.shareDescription}}" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('stores-theme');
          if (t !== 'light' && t !== 'dark' && t !== 'sepia') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
          document.getElementById('theme-color').content = { light: '#fefdfb', dark: '#141413', sepia: '#f5ecd7' }[t];
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
