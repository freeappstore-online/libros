title = "Don Quijote de la Mancha"
author = "Miguel de Cervantes"
year = 1605
genre = "Fiction"
tags = ["novela", "aventura", "humor", "siglo de oro"]
language = "es"
author_bio = "Novelista, poeta y dramaturgo español, herido en Lepanto y cautivo en Argel; su Quijote está considerado la primera novela moderna."
description = "Un hidalgo manchego enloquece de tanto leer libros de caballerías y sale por los caminos, con su escudero Sancho Panza, a deshacer agravios que solo existen en su imaginación."
excerpt = "En un lugar de la Mancha, de cuyo nombre no quiero acordarme, no ha mucho tiempo que vivía un hidalgo de los de lanza en astillero, adarga antigua, rocín flaco y galgo corredor..."

[look]
gradient = "from-amber-900 to-yellow-950"
accent = "#FBBF24"

[source]  # both parts are one ebook; each starts after its legal preliminaries (tasa, privilegio, aprobaciones)
heads = ['AL LIBRO DE DON QUIJOTE DE LA MANCHA', '(?P<kind>Capítulo) (?P<num>[IVXLC]+|primero)\. (?P<rest>.*)']

[[source.volumes]]
gutenberg = 2000
start = 'PRÓLOGO'
end = 'Segunda parte del ingenioso caballero don Quijote de la Mancha'
strip = 'Primera parte del ingenioso hidalgo don Quijote de la Mancha|Finis'

[source.volumes.titles]
'^Al Libro de Don Quijote de la Mancha$' = 'Versos preliminares'
'^Capítulo' = 'Parte 1, Capítulo'
'\]$' = ''

