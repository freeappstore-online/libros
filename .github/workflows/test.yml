name: Tests

# Typecheck, unit tests (Vitest) and end-to-end tests (Playwright) on every
# push and pull request (books#16). The e2e projects run as parallel jobs:
# chromium, firefox, webkit (iPhone 13) and edge (offline and app-update edge
# cases, Chromium with the service worker) and es (the interface in Spanish, books#54).
# How to run them: "Tests" in README.md.
#
# The deploy (deploy.yml) is the platform's pinned reusable workflow and can't
# wait for these jobs (a job can't need a job in another workflow file, and
# deploy.yml must stay as `fas publish` generates it). It does run the root
# `pnpm test` before building, so the unit tests gate the deploy; `pnpm test`
# must therefore stay browser-free. A red e2e run here is the signal to fix or revert.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc -b
      - name: Unit tests
        run: pnpm test

  e2e:
    name: E2E (${{ matrix.project }})
    # Keep browser/audio system libraries stable across ubuntu-latest upgrades.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, browser: chromium }
          - { project: firefox, browser: firefox }
          - { project: webkit, browser: webkit }
          - { project: edge, browser: chromium }
          - { project: es, browser: chromium }
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install ${{ matrix.browser }}
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      # Firefox on Linux plays no audio (the clock never advances) without a sound server
      - name: Audio output for Firefox
        if: matrix.browser == 'firefox'
        run: |
          sudo apt-get install -y -qq pulseaudio > /dev/null
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=null
          pactl set-default-sink null
      - name: End-to-end tests
        run: pnpm test:e2e --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.project }}
          path: web/test-results/
          retention-days: 7
